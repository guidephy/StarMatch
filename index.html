<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115年繁星落點分析系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .std-tag { padding: 2px 0; border-radius: 6px; font-size: 11px; font-weight: 700; text-align: center; display: block; width: 42px; margin: 0 auto; }
        .tag-頂標 { background-color: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
        .tag-前標 { background-color: #ffedd5; color: #ea580c; border: 1px solid #fdba74; }
        .tag-均標 { background-color: #dbeafe; color: #2563eb; border: 1px solid #93c5fd; }
        .tag-不採計 { color: #cbd5e1; font-weight: normal; }
        .history-card { font-size: 11px; border-left: 3px solid #e2e8f0; padding-left: 8px; margin-top: 4px; color: #475569; }
        .standard-highlight { color: #ef4444; font-weight: 700; }
    </style>
</head>
<body class="pb-20">

    <div class="max-w-7xl mx-auto px-4">
        <div class="py-10 text-center">
            <h1 class="text-3xl md:text-4xl font-black text-slate-900 mb-2">🎓 115年繁星推薦篩選分析</h1>
            <p id="loading-text" class="text-blue-600 font-bold animate-pulse">⏳ 正在載入歷史資料庫...</p>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-4 gap-8">
            <div class="xl:col-span-1 space-y-6">
                <div class="bg-slate-900 rounded-3xl shadow-xl p-6 text-white">
                    <h3 class="text-sm font-bold opacity-70 text-center mb-6 uppercase">輸入學測成績</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-[10px] font-bold text-slate-400">國文</label><input type="number" id="ch" value="13" class="w-full bg-slate-800 rounded-xl p-3 text-center text-xl font-bold"></div>
                        <div><label class="text-[10px] font-bold text-slate-400">英文</label><input type="number" id="en" value="13" class="w-full bg-slate-800 rounded-xl p-3 text-center text-xl font-bold"></div>
                        <div><label class="text-[10px] font-bold text-blue-400">數A</label><input type="number" id="ma" value="12" class="w-full bg-slate-800 rounded-xl p-3 text-center text-xl font-bold"></div>
                        <div><label class="text-[10px] font-bold text-emerald-400">數B</label><input type="number" id="mb" value="11" class="w-full bg-slate-800 rounded-xl p-3 text-center text-xl font-bold"></div>
                        <div><label class="text-[10px] font-bold text-slate-400">社會</label><input type="number" id="so" value="13" class="w-full bg-slate-800 rounded-xl p-3 text-center text-xl font-bold"></div>
                        <div><label class="text-[10px] font-bold text-slate-400">自然</label><input type="number" id="sc" value="12" class="w-full bg-slate-800 rounded-xl p-3 text-center text-xl font-bold"></div>
                    </div>
                    <button onclick="runFilter()" id="btn-filter" disabled class="w-full mt-6 bg-slate-700 text-slate-400 font-bold py-4 rounded-2xl cursor-not-allowed">
                        載入資料中...
                    </button>
                </div>
            </div>

            <div class="xl:col-span-3 space-y-4">
                <div class="bg-white rounded-3xl shadow-sm border p-4 flex justify-between items-center">
                    <select id="groupFilter" class="bg-slate-100 rounded-xl px-4 py-3 font-bold text-slate-700">
                        <option value="ALL">所有類群</option>
                        <option value="第一類群">第一類群</option>
                        <option value="第二類群">第二類群</option>
                        <option value="第三類群">第三類群</option>
                    </select>
                    <div id="status" class="text-sm font-bold text-slate-400"></div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm border overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 border-b text-slate-400 text-[10px] uppercase">
                            <tr>
                                <th class="p-5 font-bold">校系名稱與歷史實況</th>
                                <th class="w-24 font-bold text-center">115門檻</th>
                                <th class="p-5 font-bold text-right">分則</th>
                            </tr>
                        </thead>
                        <tbody id="list" class="divide-y divide-slate-100 italic text-slate-300">
                            <tr><td colspan="3" class="p-20 text-center">資料載入後即可開始篩選</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let db = [];
        const stdMap = { '國文': [13,12,10,9,7], '英文': [13,11,8,5,3], '數學A': [12,10,8,5,4], '數學B': [11,9,5,3,2], '社會': [13,12,10,8,7], '自然': [13,12,9,7,5] };

        // 🟢 關鍵功能：從外部載入 JSON 檔案
        async function loadData() {
            try {
                const response = await fetch('data.json');
                db = await response.json();
                document.getElementById('loading-text').innerText = "✅ 資料庫載入完成，共 " + db.length + " 筆校系";
                document.getElementById('btn-filter').innerText = "開始分析";
                document.getElementById('btn-filter').disabled = false;
                document.getElementById('btn-filter').className = "w-full mt-6 bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl transition shadow-lg active:scale-95";
            } catch (err) {
                document.getElementById('loading-text').innerText = "❌ 資料載入失敗，請確認 data.json 存在於相同目錄";
                console.error(err);
            }
        }

        window.onload = loadData;

        function getLevelPoint(sub, score) {
            const arr = stdMap[sub];
            for(let i=0; i<5; i++) if(score >= arr[i]) return 5-i;
            return 0;
        }

        function renderHistory(item, year) {
            const n1 = item[year+'_一輪人數'];
            const s1 = (item[year+'_一輪標準'] || '').replace(/\n/g, ' ');
            const n2 = item[year+'_二輪人數'];
            const s2 = (item[year+'_二輪標準'] || '').replace(/\n/g, ' ');
            if (!n1 || n1 === '--') return '';
            return `<div class="history-card"><span class="font-bold text-[10px] text-slate-400">${year}年：</span> 一輪 ${n1}人 (<span class="standard-highlight">${s1}</span>) / 二輪 ${n2}人 (${s2})</div>`;
        }

        function runFilter() {
            const u = {
                '國文': getLevelPoint('國文', parseInt(document.getElementById('ch').value)),
                '英文': getLevelPoint('英文', parseInt(document.getElementById('en').value)),
                '數學A': getLevelPoint('數學A', parseInt(document.getElementById('ma').value)),
                '數學B': getLevelPoint('數學B', parseInt(document.getElementById('mb').value)),
                '社會': getLevelPoint('社會', parseInt(document.getElementById('so').value)),
                '自然': getLevelPoint('自然', parseInt(document.getElementById('sc').value))
            };
            const g = document.getElementById('groupFilter').value;
            const res = db.filter(i => {
                if(g !== 'ALL' && i['類群'] !== g) return false;
                return (i['國文門檻點數']||0) <= u['國文'] && (i['英文門檻點數']||0) <= u['英文'] && (i['數學A門檻點數']||0) <= u['數學A'] && (i['數學B門檻點數']||0) <= u['數學B'] && (i['社會門檻點數']||0) <= u['社會'] && (i['自然門檻點數']||0) <= u['自然'];
            });

            document.getElementById('status').innerText = `找到 ${res.length} 個符合校系`;
            document.getElementById('list').innerHTML = res.map(i => `
                <tr class="hover:bg-blue-50/50 transition">
                    <td class="p-5">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="bg-slate-100 text-slate-500 text-[9px] font-black px-2 py-0.5 rounded">${i['類群']}</span>
                            <div class="font-bold text-slate-800">${i['校系代碼名稱']}</div>
                        </div>
                        ${renderHistory(i, '114')}${renderHistory(i, '113')}${renderHistory(i, '112')}
                    </td>
                    <td class="p-5">
                        <div class="flex flex-wrap gap-1 justify-center w-24 mx-auto">
                            ${['國文','英文','數學A','數學B','社會','自然'].map(s => {
                                const t = i[s+'門檻'];
                                if(!t || t==='--') return '<span class="tag-不採計">--</span>';
                                return `<span class="std-tag tag-${t}">${t}</span>`;
                            }).join('')}
                        </div>
                    </td>
                    <td class="p-5 text-right"><a href="${i['網址']}" target="_blank" class="text-blue-600 font-bold hover:underline">分則</a></td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
