<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>116學年度繁星推薦校系查詢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; color: #0f172a; overflow-x: hidden; }
        
        .std-tag { padding: 1px 0; border-radius: 4px; font-size: 10px; font-weight: 900; text-align: center; display: block; width: 34px; }
        .tag-頂標 { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .tag-前標 { background: #ffedd5; color: #9a3412; border: 1px solid #fed7aa; }
        .tag-均標 { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
        .tag-後標 { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
        .tag-底標 { background: #fef3c7; color: #92400e; }
        .tag-不採計 { background: #f8fafc; color: #cbd5e1; border: 1px solid #f1f5f9; }

        .score-input { border: 1.5px solid #e2e8f0; transition: all 0.2s; font-size: 16px; /* 防止 iOS 自動縮放 */ }
        .score-input:focus { border-color: #2563eb; background: #fff; outline: none; }

        /* 🚀 關鍵 RWD 優化：手機端 4 欄配置，極大節省空間 */
        .input-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        @media (min-width: 1024px) { .input-grid { grid-template-columns: repeat(8, 1fr); gap: 10px; } }

        #search-section { display: none; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-5xl mx-auto p-3 sm:p-5">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-1.5">
                    <span class="text-xl">🎓</span>
                    <h1 class="text-base sm:text-lg font-black text-slate-950 tracking-tighter">116 學年度繁星推薦校系查詢</h1>
                </div>
                <div id="data-status" class="text-[8px] font-black text-slate-400 bg-slate-50 px-1.5 py-0.5 rounded border border-slate-100 uppercase">Loading</div>
            </div>
            
            <p class="text-xs text-slate-500 mb-3">資料：<a href="https://www.cac.edu.tw/star116/index.php" target="_blank" rel="noopener noreferrer" class="text-blue-700 underline">116 學年度繁星推薦</a></p><div class="input-grid mb-3">
                <div>
                    <label for="rank" class="text-[9px] font-black text-blue-700 block text-center mb-0.5">校內%</label>
                    <input type="number" min="1" max="100" step="1" required id="rank" placeholder="%" class="score-input w-full bg-slate-50 rounded-lg py-1.5 text-center font-black text-slate-950">
                </div>
                <div>
                    <label for="ch" class="text-[9px] font-black text-slate-400 block text-center mb-0.5">國文</label>
                    <select id="ch" class="score-input w-full bg-slate-50 rounded-lg py-1.5 text-center font-black"><option value="">未填／未應考</option><option value="5">頂標</option><option value="4">前標</option><option value="3">均標</option><option value="2">後標</option><option value="1">底標</option><option value="0">未達底標</option></select>
                    <div id="level-ch" class="text-[8px] text-center font-black h-3"></div>
                </div>
                <div>
                    <label for="en" class="text-[9px] font-black text-slate-400 block text-center mb-0.5">英文</label>
                    <select id="en" class="score-input w-full bg-slate-50 rounded-lg py-1.5 text-center font-black"><option value="">未填／未應考</option><option value="5">頂標</option><option value="4">前標</option><option value="3">均標</option><option value="2">後標</option><option value="1">底標</option><option value="0">未達底標</option></select>
                    <div id="level-en" class="text-[8px] text-center font-black h-3"></div>
                </div>
                <div>
                    <label for="ma" class="text-[9px] font-black text-blue-500 block text-center mb-0.5">數A</label>
                    <select id="ma" class="score-input w-full bg-slate-50 rounded-lg py-1.5 text-center font-black"><option value="">未填／未應考</option><option value="5">頂標</option><option value="4">前標</option><option value="3">均標</option><option value="2">後標</option><option value="1">底標</option><option value="0">未達底標</option></select>
                    <div id="level-ma" class="text-[8px] text-center font-black h-3"></div>
                </div>
                <div>
                    <label for="mb" class="text-[9px] font-black text-emerald-500 block text-center mb-0.5">數B</label>
                    <select id="mb" class="score-input w-full bg-slate-50 rounded-lg py-1.5 text-center font-black"><option value="">未填／未應考</option><option value="5">頂標</option><option value="4">前標</option><option value="3">均標</option><option value="2">後標</option><option value="1">底標</option><option value="0">未達底標</option></select>
                    <div id="level-mb" class="text-[8px] text-center font-black h-3"></div>
                </div>
                <div>
                    <label for="so" class="text-[9px] font-black text-slate-400 block text-center mb-0.5">社會</label>
                    <select id="so" class="score-input w-full bg-slate-50 rounded-lg py-1.5 text-center font-black"><option value="">未填／未應考</option><option value="5">頂標</option><option value="4">前標</option><option value="3">均標</option><option value="2">後標</option><option value="1">底標</option><option value="0">未達底標</option></select>
                    <div id="level-so" class="text-[8px] text-center font-black h-3"></div>
                </div>
                <div>
                    <label for="sc" class="text-[9px] font-black text-slate-400 block text-center mb-0.5">自然</label>
                    <select id="sc" class="score-input w-full bg-slate-50 rounded-lg py-1.5 text-center font-black"><option value="">未填／未應考</option><option value="5">頂標</option><option value="4">前標</option><option value="3">均標</option><option value="2">後標</option><option value="1">底標</option><option value="0">未達底標</option></select>
                    <div id="level-sc" class="text-[8px] text-center font-black h-3"></div>
                </div>
            </div>

            <div class="mb-3">
                <label for="hearing" class="text-xs font-bold">英聽</label>
                <select id="hearing" class="score-input rounded-lg py-1 px-2 text-sm"><option value="">未填／未應考</option><option value="3">A 級</option><option value="2">B 級</option><option value="1">C 級</option><option value="0">F 級</option></select>
            </div>
            <div class="flex items-center gap-2">
                <select id="groupFilter" aria-label="學群" class="bg-slate-900 text-white rounded-xl px-3 py-2 text-xs font-black outline-none">
                    <option value="ALL">一至三類全部</option>
                    <option value="第一類群">一類</option><option value="第二類群">二類</option><option value="第三類群">三類</option>
                </select>
                <button onclick="firstSearch()" id="btn-search" disabled class="flex-1 bg-blue-600 text-white font-black py-2 rounded-xl shadow-md transition-all text-sm active:scale-95">
                    執行篩選
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-3 sm:p-5 flex-grow w-full">
        <section id="search-section" class="mb-4 p-4 bg-blue-50 border border-blue-100 rounded-2xl space-y-3 shadow-sm">
            <div class="flex items-center justify-between">
                <h2 class="text-[10px] font-black text-blue-700 uppercase tracking-widest flex items-center gap-1.5">
                    💡 進階篩選（可即時縮小結果）
                </h2>
                <button type="button" onclick="resetAdvanced()" class="text-xs text-blue-700 underline">清除進階條件</button><div id="result-count" class="bg-blue-600 text-white px-2 py-0.5 rounded text-[9px] font-black">0 筆</div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-12 gap-2">
                <input type="text" id="keyword" aria-label="校系關鍵字" oninput="runFilter()" placeholder="🔍 搜尋大學、科系或代碼（空格可組合關鍵字）..." class="md:col-span-6 bg-white border-none rounded-xl px-4 py-2.5 text-xs font-bold shadow-sm outline-none">
                <select id="regionFilter" aria-label="地區" onchange="runFilter()" class="md:col-span-3 bg-white border-none rounded-xl px-4 py-2.5 text-xs font-bold text-slate-600 outline-none shadow-sm">
                    <option value="ALL">📍 所有地區（校區優先）</option>
                    <option value="NORTH">北部</option><option value="CENTRAL">中部</option>
                    <option value="SOUTH">南部</option><option value="EAST">東部</option><option value="ISLAND">離島</option>
                </select>
                <select id="typeFilter" aria-label="公私立" onchange="runFilter()" class="md:col-span-3 bg-white border-none rounded-xl px-4 py-2.5 text-xs font-bold text-slate-600 outline-none shadow-sm">
                    <option value="ALL">🏛️ 所有學校</option>
                    <option value="PUBLIC">公立</option><option value="PRIVATE">私立</option>
                </select>
            </div>
        </section>

        <div id="result-container" aria-live="polite" class="space-y-3">
            <div class="py-20 text-center bg-white rounded-3xl border-2 border-dashed border-slate-200">
                <p class="text-slate-300 font-black text-sm px-10">請填校內排名與各科五標，再點擊「執行篩選」</p>
            </div>
        </div>
    </main>

    <footer class="text-center py-6 text-slate-400 text-[10px] font-bold tracking-widest border-t border-slate-100 bg-white/50">
        桃園市立觀音高中 林仟弘老師製作
    </footer>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
