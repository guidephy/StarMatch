<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115年繁星推薦落點建議</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; color: #0f172a; overflow-x: hidden; }
        
        .std-tag { padding: 1px 0; border-radius: 4px; font-size: 10px; font-weight: 900; text-align: center; display: block; width: 34px; }
        .tag-頂標 { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .tag-前標 { background: #ffedd5; color: #9a3412; border: 1px solid #fed7aa; }
        .tag-均標 { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
        .tag-後標 { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
        .tag-底標 { background: #fef3c7; color: #92400e; }
        .tag-不採計 { background: #f8fafc; color: #cbd5e1; border: 1px solid #f1f5f9; }

        .score-input { border: 1.5px solid #e2e8f0; transition: all 0.2s; font-size: 16px; /* 防止 iOS 自動縮放 */ }
        .score-input:focus { border-color: #2563eb; background: #fff; outline: none; }

        /* 🚀 關鍵 RWD 優化：手機端 4 欄配置，極大節省空間 */
        .input-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        @media (min-width: 1024px) { .input-grid { grid-template-columns: repeat(7, 1fr); gap: 10px; } }

        #search-section { display: none; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-5xl mx-auto p-3 sm:p-5">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-1.5">
                    <span class="text-xl">🎓</span>
                    <h1 class="text-base sm:text-lg font-black text-slate-950 tracking-tighter">115 年繁星推薦落點建議</h1>
                </div>
                <div id="data-status" class="text-[8px] font-black text-slate-400 bg-slate-50 px-1.5 py-0.5 rounded border border-slate-100 uppercase">Loading</div>
            </div>
            
            <div class="input-grid mb-3">
                <div>
                    <label class="text-[9px] font-black text-blue-700 block text-center mb-0.5">校內%</label>
                    <input type="number" id="rank" placeholder="%" class="score-input w-full bg-slate-50 rounded-lg py-1.5 text-center font-black text-slate-950">
                </div>
                <div>
                    <label class="text-[9px] font-black text-slate-400 block text-center mb-0.5">國文</label>
                    <input type="number" id="ch" oninput="updateLevels()" class="score-input w-full bg-slate-50 rounded-lg py-1.5 text-center font-black text-slate-950">
                    <div id="level-ch" class="text-[8px] text-center font-black h-3"></div>
                </div>
                <div>
                    <label class="text-[9px] font-black text-slate-400 block text-center mb-0.5">英文</label>
                    <input type="number" id="en" oninput="updateLevels()" class="score-input w-full bg-slate-50 rounded-lg py-1.5 text-center font-black text-slate-950">
                    <div id="level-en" class="text-[8px] text-center font-black h-3"></div>
                </div>
                <div>
                    <label class="text-[9px] font-black text-blue-500 block text-center mb-0.5">數A</label>
                    <input type="number" id="ma" oninput="updateLevels()" class="score-input w-full bg-slate-50 rounded-lg py-1.5 text-center font-black text-slate-950">
                    <div id="level-ma" class="text-[8px] text-center font-black h-3"></div>
                </div>
                <div>
                    <label class="text-[9px] font-black text-emerald-500 block text-center mb-0.5">數B</label>
                    <input type="number" id="mb" oninput="updateLevels()" class="score-input w-full bg-slate-50 rounded-lg py-1.5 text-center font-black text-slate-950">
                    <div id="level-mb" class="text-[8px] text-center font-black h-3"></div>
                </div>
                <div>
                    <label class="text-[9px] font-black text-slate-400 block text-center mb-0.5">社會</label>
                    <input type="number" id="so" oninput="updateLevels()" class="score-input w-full bg-slate-50 rounded-lg py-1.5 text-center font-black text-slate-950">
                    <div id="level-so" class="text-[8px] text-center font-black h-3"></div>
                </div>
                <div>
                    <label class="text-[9px] font-black text-slate-400 block text-center mb-0.5">自然</label>
                    <input type="number" id="sc" oninput="updateLevels()" class="score-input w-full bg-slate-50 rounded-lg py-1.5 text-center font-black text-slate-950">
                    <div id="level-sc" class="text-[8px] text-center font-black h-3"></div>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <select id="groupFilter" class="bg-slate-900 text-white rounded-xl px-3 py-2 text-xs font-black outline-none">
                    <option value="ALL">所有類群</option>
                    <option value="第一類群">一類</option><option value="第二類群">二類</option><option value="第三類群">三類</option>
                </select>
                <button onclick="firstSearch()" id="btn-search" disabled class="flex-1 bg-blue-600 text-white font-black py-2 rounded-xl shadow-md transition-all text-sm active:scale-95">
                    執行篩選
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-3 sm:p-5 flex-grow w-full">
        <section id="search-section" class="mb-4 p-4 bg-blue-50 border border-blue-100 rounded-2xl space-y-3 shadow-sm">
            <div class="flex items-center justify-between">
                <h2 class="text-[10px] font-black text-blue-700 uppercase tracking-widest flex items-center gap-1.5">
                    💡 進階篩選
                </h2>
                <div id="result-count" class="bg-blue-600 text-white px-2 py-0.5 rounded text-[9px] font-black">0 筆</div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-12 gap-2">
                <input type="text" id="keyword" oninput="runFilter()" placeholder="🔍 搜尋大學或科系名稱..." class="md:col-span-6 bg-white border-none rounded-xl px-4 py-2.5 text-xs font-bold shadow-sm outline-none">
                <select id="regionFilter" onchange="runFilter()" class="md:col-span-3 bg-white border-none rounded-xl px-4 py-2.5 text-xs font-bold text-slate-600 outline-none shadow-sm">
                    <option value="ALL">📍 所有地區</option>
                    <option value="NORTH">北部</option><option value="CENTRAL">中部</option>
                    <option value="SOUTH">南部</option><option value="EAST">東部</option><option value="ISLAND">離島</option>
                </select>
                <select id="typeFilter" onchange="runFilter()" class="md:col-span-3 bg-white border-none rounded-xl px-4 py-2.5 text-xs font-bold text-slate-600 outline-none shadow-sm">
                    <option value="ALL">🏛️ 所有學校</option>
                    <option value="PUBLIC">國立</option><option value="PRIVATE">私立</option>
                </select>
            </div>
        </section>

        <div id="result-container" class="space-y-3">
            <div class="py-20 text-center bg-white rounded-3xl border-2 border-dashed border-slate-200">
                <p class="text-slate-300 font-black text-sm px-10">請輸入成績並點擊「執行篩選」</p>
            </div>
        </div>
    </main>

    <footer class="text-center py-6 text-slate-400 text-[10px] font-bold tracking-widest border-t border-slate-100 bg-white/50">
        桃園市立觀音高中 林仟弘老師製作
    </footer>

    <script>
        let db = [];
        const stdMap = { '國文': [13,12,10,9,7], '英文': [13,11,8,5,3], '數學A': [12,10,8,5,4], '數學B': [11,9,5,3,2], '社會': [13,12,10,8,7], '自然': [13,12,9,7,5] };
        
        const regionMapping = {
            'NORTH': ["國立臺灣大學", "國立臺灣師範大學", "東吳大學", "國立政治大學", "中原大學", "國立清華大學", "國立陽明交通大學", "淡江大學", "國立中央大學", "中國文化大學", "大同大學", "輔仁大學", "國立臺灣海洋大學", "國立臺北藝術大學", "長庚大學", "國立臺北教育大學", "臺北市立大學", "國立體育大學", "元智大學", "中華大學", "華梵大學", "銘傳大學", "世新大學", "實踐大學", "國立臺灣藝術大學", "玄奘大學", "真理大學", "國立臺北大學", "臺北醫學大學", "開南大學", "康寧大學", "馬偕醫學院"],
            'CENTRAL': ["國立中興大學", "東海大學", "中國醫藥大學", "逢甲大學", "靜宜大學", "國立彰化師範大學", "中山醫學大學", "國立臺中教育大學", "大葉大學", "國立暨南國際大學", "國立臺灣體育運動大學", "亞洲大學", "國立聯合大學"],
            'SOUTH': ["國立成功大學", "高雄醫學大學", "國立高雄師範大學", "國立中山大學", "國立臺南大學", "國立屏東大學", "國立中正大學", "義守大學", "長榮大學", "南華大學", "國立臺南藝術大學", "國立嘉義大學", "國立高雄大學", "中信金融管理學院"],
            'EAST': ["國立東華大學", "國立臺東大學", "慈濟大學", "佛光大學", "國立宜蘭大學"],
            'ISLAND': ["國立金門大學"]
        };

        async function init() {
            try {
                const res = await fetch('data.json');
                db = await res.json();
                document.getElementById('data-status').innerText = "Ready";
                document.getElementById('btn-search').disabled = false;
            } catch (e) { document.getElementById('data-status').innerText = "Error"; }
        }

        function updateLevels() {
            const subs = ['ch','en','ma','mb','so','sc'];
            subs.forEach(id => {
                const subName = id==='ch'?'國文':id==='en'?'英文':id==='ma'?'數學A':id==='mb'?'數學B':id==='so'?'社會':'自然';
                const val = parseInt(document.getElementById(id).value);
                const info = document.getElementById('level-'+id);
                if(!val && val !== 0) { info.innerText = ""; return; }
                const arr = stdMap[subName];
                let lv = "未達", color = "text-slate-300";
                if(val >= arr[0]) { lv="頂"; color="text-red-700"; }
                else if(val >= arr[1]) { lv="前"; color="text-orange-600"; }
                else if(val >= arr[2]) { lv="均"; color="text-blue-700"; }
                else if(val >= arr[3]) { lv="後"; color="text-slate-500"; }
                else if(val >= arr[4]) { lv="底"; color="text-amber-900"; }
                info.innerText = lv; info.className = `text-[8px] text-center font-black h-3 ${color}`;
            });
        }

        function firstSearch() {
            const message = "【溫馨提醒】\n\n本系統僅供初步參考。請務必詳閱簡章，並與老師及家長討論。祝福您金榜題名！";
            alert(message);
            document.getElementById('search-section').style.display = 'block';
            runFilter();
            // 手機端微調滾動高度，讓結果浮現
            window.scrollTo({ top: document.getElementById('search-section').offsetTop - 120, behavior: 'smooth' });
        }

        function renderHistory(item, yr) {
            const n1 = item[yr+'_一輪人數'] || '--', s1 = (item[yr+'_一輪標準'] || '--').split('\n')[0];
            const n2 = item[yr+'_二輪人數'] || '--', s2 = (item[yr+'_二輪標準'] || '--').split('\n')[0];
            if(n1 === '--' && n2 === '--') return `<div class="bg-slate-50 rounded-lg p-2 text-center text-[9px] text-slate-300 font-bold">${yr} 無資料</div>`;
            return `
                <div class="bg-slate-50 border border-slate-100 rounded-lg p-2 flex flex-col justify-center">
                    <div class="text-[8px] font-black text-slate-400 mb-1 border-b border-slate-200 pb-0.5 uppercase">${yr}錄取</div>
                    <div class="text-[10px] font-bold text-slate-950 leading-tight">
                        一輪: ${n1}人 (${s1})<br>二輪: ${n2}人 (${s2})
                    </div>
                </div>`;
        }

        function runFilter() {
            const u = {
                '國文': getPt('國文', parseInt(document.getElementById('ch').value || 0)),
                '英文': getPt('英文', parseInt(document.getElementById('en').value || 0)),
                '數學A': getPt('數學A', parseInt(document.getElementById('ma').value || 0)),
                '數學B': getPt('數學B', parseInt(document.getElementById('mb').value || 0)),
                '社會': getPt('社會', parseInt(document.getElementById('so').value || 0)),
                '自然': getPt('自然', parseInt(document.getElementById('sc').value || 0))
            };
            const grp = document.getElementById('groupFilter').value;
            const reg = document.getElementById('regionFilter').value;
            const typ = document.getElementById('typeFilter').value;
            const key = document.getElementById('keyword').value.toLowerCase();

            const res = db.filter(i => {
                const name = i['校系代碼名稱'];
                if(grp !== 'ALL' && i['類群'] !== grp) return false;
                if(key && !name.toLowerCase().includes(key)) return false;
                if(typ === 'PUBLIC' && !name.includes("國立")) return false;
                if(typ === 'PRIVATE' && name.includes("國立")) return false;
                if(reg !== 'ALL') {
                    const matchRegion = regionMapping[reg].some(school => name.startsWith(school));
                    if(!matchRegion) return false;
                }
                return (i['國文門檻點數']||0) <= u['國文'] && (i['英文門檻點數']||0) <= u['英文'] && 
                       (i['數學A門檻點數']||0) <= u['數學A'] && (i['數學B門檻點數']||0) <= u['數學B'] && 
                       (i['社會門檻點數']||0) <= u['社會'] && (i['自然門檻點數']||0) <= u['自然'];
            });

            document.getElementById('result-count').innerText = `${res.length} 筆`;
            const container = document.getElementById('result-container');
            if(res.length === 0) {
                container.innerHTML = `<div class="p-20 text-center text-slate-400 font-bold bg-white rounded-3xl border-2 border-dashed border-slate-200">查無結果</div>`;
                return;
            }

            container.innerHTML = res.map(i => `
                <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                    <div class="flex flex-col gap-3 mb-3">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="bg-slate-950 text-white text-[8px] font-black px-1.5 py-0.5 rounded uppercase">${i['類群']}</span>
                                <a href="${i['網址']}" target="_blank" class="text-blue-700 text-[10px] font-black hover:underline">簡章分則 ↗</a>
                            </div>
                            <h3 class="text-base font-black text-slate-950 leading-tight">${i['校系代碼名稱']}</h3>
                        </div>
                        <div class="flex items-center justify-between bg-slate-50 px-2 py-2 rounded-xl border border-slate-100">
                            ${['國文','英文','數學A','數學B','社會','自然'].map(s => {
                                const t = i[s+'門檻'];
                                return `<div class="flex flex-col items-center gap-0.5">
                                            <span class="text-[7px] font-black text-slate-300 uppercase">${s.replace('數學','數')}</span>
                                            <span class="std-tag ${t && t !== '--' ? 'tag-'+t : 'tag-不採計'}">${t || '--'}</span>
                                        </div>`;
                            }).join('')}
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2">${renderHistory(i,'114')}${renderHistory(i,'113')}${renderHistory(i,'112')}</div>
                </div>
            `).join('');
        }

        function getPt(sub, score) { const arr = stdMap[sub]; for(let i=0; i<5; i++) if(score >= arr[i]) return 5-i; return 0; }
        window.onload = init;
    </script>
</body>
</html>
